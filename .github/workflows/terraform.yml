name: terraform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time; applies also queue across branches there.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: Tozapid/demo-ci-cd-skeleton/.github/workflows/terraform.yml@main
    # The plan and apply jobs trade GitHub's OIDC token for the AWS role; the
    # release job writes the tag and the release of the newest CHANGELOG entry.
    permissions:
      contents: write
      id-token: write
