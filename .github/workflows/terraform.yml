name: terraform

on:
  # closed: a merged or closed pull request takes its preview down.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview:
        description: "Pull request number: deploy its preview (empty: deploy the branch picked above over the site)"
        type: string
        default: ""
      destroy:
        description: "Destroy that preview instead"
        type: boolean
        default: false
  # The daily sweep of previews left behind.
  schedule:
    - cron: "40 4 * * *"

permissions:
  contents: read

# One run per branch at a time, per preview and for the sweep; applies also
# queue across branches there.
concurrency:
  group: terraform-${{ github.event_name == 'schedule' && 'sweep' || github.ref }}-${{ inputs.preview }}
  cancel-in-progress: false

jobs:
  ci:
    uses: Tozapid/demo-ci-cd-skeleton/.github/workflows/terraform.yml@main
    with:
      preview: ${{ inputs.preview || '' }}
      destroy: ${{ inputs.destroy || false }}
    # The plan, apply and preview jobs trade GitHub's OIDC token for the AWS
    # role; the release job writes the tag and the release of the newest
    # CHANGELOG entry; the preview jobs comment on the pull request.
    permissions:
      contents: write
      id-token: write
      pull-requests: write
